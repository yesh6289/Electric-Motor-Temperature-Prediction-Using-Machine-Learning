<!DOCTYPE html>
<html>
<head>
    <title>Electric Motor Temperature Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        /* Header Bar */
        .header {
            background: #111;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* Form Container */
        .container {
            width: 450px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            border-color: #000;
            outline: none;
        }

        /* Button */
        button {
            width: 100%;
            padding: 12px;
            background: black;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }
    </style>
</head>

<body>

<div class="header">
    Electric Motor Temperature
</div>

<div class="container">
    <h2>Electric Motor Temperature Prediction</h2>

    <form action="/predict" method="post">
        <input type="text" name="ambient" placeholder="Ambient Temperature" required>
        <input type="text" name="coolant" placeholder="Coolant Temperature" required>
        <input type="text" name="u_d" placeholder="Voltage d-component" required>
        <input type="text" name="u_q" placeholder="Voltage q-component" required>
        <input type="text" name="motor_speed" placeholder="Motor Speed" required>
        <input type="text" name="i_d" placeholder="Current d-component" required>
        <input type="text" name="i_q" placeholder="Current q-component" required>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
