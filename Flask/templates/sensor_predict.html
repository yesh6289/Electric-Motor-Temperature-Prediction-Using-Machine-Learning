<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        /* Header */
        .header {
            background: #111;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* Result Container */
        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #333;
        }

        /* Prediction Highlight */
        .prediction {
            font-size: 22px;
            font-weight: bold;
            color: #0a58ca;
            margin: 20px 0;
        }

        /* Button */
        .btn {
            display: inline-block;
            padding: 12px 20px;
            background: black;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }

        .btn:hover {
            background: #333;
        }
    </style>
</head>

<body>

<div class="header">
    Electric Motor Temperature
</div>

<div class="container">
    <h2>Prediction Result</h2>

    <div class="prediction">
        {{ prediction_text }}
    </div>

    <a href="/" class="btn">Go Back</a>
</div>

</body>
</html>
